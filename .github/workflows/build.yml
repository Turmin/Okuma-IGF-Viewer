name: Build executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import okuma_igf_viewer; print(okuma_igf_viewer.__version__)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in okuma_igf_viewer/__init__.py" >&2
            exit 1
          fi

      - name: Run tests
        run: python -m pytest

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name Okuma-IGF-Viewer
          --icon okuma_igf_viewer/assets/app.ico
          --add-data "okuma_igf_viewer/assets;okuma_igf_viewer/assets"
          main.py

      - name: Check that the executable starts
        shell: pwsh
        run: |
          $env:OKUMA_IGF_VIEWER_HOME = $env:RUNNER_TEMP
          $process = Start-Process -FilePath "dist/Okuma-IGF-Viewer.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "The executable exited with code $($process.ExitCode)" }

      - uses: actions/upload-artifact@v7
        with:
          name: Okuma-IGF-Viewer-${{ steps.version.outputs.version }}
          path: dist/Okuma-IGF-Viewer.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Okuma-IGF-Viewer-${{ needs.build.outputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" Okuma-IGF-Viewer.exe --title "Okuma IGF Viewer ${{ needs.build.outputs.version }}" --generate-notes
